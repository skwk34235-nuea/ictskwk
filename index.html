<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://script.google.com/macros/s/AKfycbzCNgK-JQZ-LzuEwBT2yw0bxzEJvgkw7Z4WIlEAmTp1Ti9GhKXZRqWD0wGcmdOZ3-iF/exec?authuser=0"
        allow="geolocation; microphone; camera"
        allowfullscreen>
    </iframe>
</body>
</html>
